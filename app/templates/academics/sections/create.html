<!-- app/templates/academics/sections/create.html -->
{% extends "layouts/director.html" %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700 p-6">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold text-slate-800 dark:text-white">إضافة شعبة</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">أدخل بيانات الشعبة الجديدة</p>
            </div>
            <a href="/academics/sections/list" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-300">
                ✕ إلغاء
            </a>
        </div>

        <form id="createForm" method="POST" action="/api/v1/academics/sections/create" onsubmit="return handleSubmit(event, this)">
            <div class="space-y-4">
                <!-- السنة الدراسية -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">
                        السنة الدراسية <span class="text-red-500">*</span>
                    </label>
                    <select name="year_id" id="yearSelect" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 dark:bg-slate-700 dark:text-white transition-colors duration-200" required>
                        <option value="">اختر السنة الدراسية</option>
                        {% for year in years %}
                        <option value="{{ year.id }}">{{ year.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- الصف -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">
                        الصف <span class="text-red-500">*</span>
                    </label>
                    <select name="grade_id" id="gradeSelect" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 dark:bg-slate-700 dark:text-white transition-colors duration-200" required>
                        <option value="">اختر الصف</option>
                        {% for g in grades %}
                        <option value="{{ g.id }}" data-year="{{ g.year_id }}">{{ g.name }}</option>
                        {% endfor %}
                    </select>
                    <p class="text-xs text-slate-400 mt-1">يتم تصفية الصفوف حسب السنة المختارة</p>
                </div>

                <!-- اسم الشعبة -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">
                        اسم الشعبة <span class="text-red-500">*</span>
                    </label>
                    <input type="text" name="name" placeholder="مثال: 1-أ" 
                           class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 dark:bg-slate-700 dark:text-white transition-colors duration-200" 
                           required>
                    <p class="text-xs text-slate-400 mt-1">مثال: 1-أ، 1-ب، 2-أ، ...</p>
                </div>

                <!-- السعة -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">
                        السعة
                    </label>
                    <input type="number" name="capacity" value="30" min="1"
                           class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 dark:bg-slate-700 dark:text-white transition-colors duration-200">
                    <p class="text-xs text-slate-400 mt-1">عدد الطلاب المسموح به في الشعبة</p>
                </div>

                <!-- المعلمين (رائد الفصل) -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">
                        رائد الفصل
                    </label>
                    <select name="teacher_ids" id="teacherSelect" multiple
                            class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 dark:bg-slate-700 dark:text-white transition-colors duration-200 min-h-[100px]">
                        <option value="">اختر المعلمين (يمكن اختيار أكثر من واحد)</option>
                        {% for teacher in teachers %}
                        <option value="{{ teacher.id }}">{{ teacher.first_name }} {{ teacher.last_name }} - {{ teacher.specialization or 'بدون تخصص' }}</option>
                        {% endfor %}
                    </select>
                    <p class="text-xs text-slate-400 mt-1">يمكن اختيار أكثر من معلم كرائد فصل (اضغط Ctrl+اختيار)</p>
                </div>

                <!-- حالة التفعيل -->
                <div class="flex items-center space-x-3 space-x-reverse">
                    <input type="checkbox" name="is_active" value="true" checked
                           class="w-4 h-4 text-primary-600 border-slate-300 rounded focus:ring-primary-500 dark:border-slate-600">
                    <label class="text-sm text-slate-700 dark:text-slate-300">مفعل</label>
                </div>
            </div>
            
            <div class="flex gap-3 mt-6 pt-6 border-t border-slate-200 dark:border-slate-700">
                <button type="submit" id="submitBtn" class="flex-1 bg-primary-600 hover:bg-primary-700 text-white px-4 py-2.5 rounded-lg font-medium transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
                    إضافة
                </button>
                <a href="/academics/sections/list" class="flex-1 bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-300 px-4 py-2.5 rounded-lg font-medium transition-colors duration-200 text-center">
                    إلغاء
                </a>
            </div>
        </form>
    </div>
</div>

<script>
// تصفية الصفوف حسب السنة المختارة
document.addEventListener('DOMContentLoaded', function() {
    const yearSelect = document.getElementById('yearSelect');
    const gradeSelect = document.getElementById('gradeSelect');
    const allOptions = Array.from(gradeSelect.querySelectorAll('option'));
    
    // حفظ الخيارات الأصلية
    const originalOptions = allOptions.filter(opt => opt.value !== '').map(opt => ({
        value: opt.value,
        text: opt.text,
        year: opt.getAttribute('data-year')
    }));
    
    function filterGrades() {
        const yearId = yearSelect.value;
        
        // حذف جميع الخيارات ما عدا الأول
        while (gradeSelect.options.length > 1) {
            gradeSelect.remove(1);
        }
        
        // إضافة الخيارات المفلترة
        const filtered = originalOptions.filter(opt => yearId === '' || opt.year === yearId);
        filtered.forEach(opt => {
            const option = document.createElement('option');
            option.value = opt.value;
            option.textContent = opt.text;
            option.setAttribute('data-year', opt.year);
            gradeSelect.appendChild(option);
        });
        
        // إذا لم تكن هناك خيارات، أضف رسالة
        if (filtered.length === 0) {
            const option = document.createElement('option');
            option.value = '';
            option.textContent = 'لا توجد صفوف في هذه السنة';
            option.disabled = true;
            gradeSelect.appendChild(option);
        }
        
        gradeSelect.value = '';
    }
    
    yearSelect.addEventListener('change', filterGrades);
    
    // التصفية الأولية
    filterGrades();
});

async function handleSubmit(event, form) {
    event.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'جاري الإضافة...';

    const formData = new FormData(form);
    const data = Object.fromEntries(formData.entries());
    
    // معالجة البيانات
    if (data.capacity) data.capacity = parseInt(data.capacity);
    data.is_active = data.is_active === 'true';
    
    // معالجة المعلمين المختارين (متعدد)
    const teacherSelect = document.getElementById('teacherSelect');
    const selectedTeachers = Array.from(teacherSelect.selectedOptions)
        .filter(opt => opt.value !== '')
        .map(opt => opt.value);
    data.teacher_ids = selectedTeachers;

    try {
        const response = await fetch(form.action, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(data)
        });
        
        if (response.ok) {
            const result = await response.json();
            showMessage('✅ ' + result.message, 'success');
            setTimeout(() => {
                window.location.href = '/academics/sections/list';
            }, 1500);
        } else {
            const error = await response.json();
            showMessage('❌ ' + (error.detail || 'حدث خطأ أثناء الإضافة'), 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'إضافة';
        }
    } catch (error) {
        showMessage('❌ حدث خطأ في الاتصال بالخادم', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'إضافة';
        console.error('Error:', error);
    }
}

function showMessage(message, type = 'success') {
    const colors = {
        success: 'bg-green-50 text-green-800 border-green-200',
        error: 'bg-red-50 text-red-800 border-red-200',
        warning: 'bg-yellow-50 text-yellow-800 border-yellow-200'
    };
    document.querySelectorAll('.toast-message').forEach(el => el.remove());
    const div = document.createElement('div');
    div.className = `toast-message fixed top-4 right-4 p-4 rounded-lg border ${colors[type]} shadow-lg z-50 max-w-md animate-slide-in`;
    div.innerHTML = message;
    document.body.appendChild(div);
    setTimeout(() => { div.remove(); }, 5000);
}
</script>

<style>
@keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}
.animate-slide-in {
    animation: slideIn 0.3s ease-out;
}

/* تحسين شكل الـ select المتعدد */
select[multiple] {
    scroll-behavior: smooth;
}
select[multiple] option {
    padding: 6px 10px;
    border-bottom: 1px solid #e2e8f0;
    cursor: pointer;
}
select[multiple] option:checked {
    background: #3b82f6 linear-gradient(0deg, #3b82f6 0%, #3b82f6 100%);
    color: white;
}
select[multiple] option:hover {
    background: #e2e8f0;
}
.dark select[multiple] option:hover {
    background: #334155;
}
</style>
{% endblock %}
