{% extends "layouts/director.html" %}
{% block content %}
<div class="space-y-6 max-w-2xl">
    <h1 class="text-2xl font-bold text-slate-800 dark:text-white">{{ title }}</h1>
    <form method="POST" action="{% if mode == 'create' %}/api/v1/students{% else %}/api/v1/students/{{ student.id }}{% endif %}" class="bg-white dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700 p-6 space-y-4">
        <div class="grid grid-cols-2 gap-4">
            <div><label class="block text-sm font-medium mb-1">رقم الطالب</label><input name="student_number" required value="{{ student.student_number if mode == 'edit' else '' }}" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 outline-none focus:ring-2 focus:ring-primary-500"></div>
            <div><label class="block text-sm font-medium mb-1">الرقم الوطني</label><input name="national_id" value="{{ student.national_id if mode == 'edit' else '' }}" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 outline-none focus:ring-2 focus:ring-primary-500"></div>
            <div><label class="block text-sm font-medium mb-1">الاسم الأول</label><input name="first_name" required value="{{ student.first_name if mode == 'edit' else '' }}" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 outline-none focus:ring-2 focus:ring-primary-500"></div>
            <div><label class="block text-sm font-medium mb-1">الاسم الأخير</label><input name="last_name" required value="{{ student.last_name if mode == 'edit' else '' }}" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 outline-none focus:ring-2 focus:ring-primary-500"></div>
            <div><label class="block text-sm font-medium mb-1">الجنس</label><select name="gender" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 outline-none"><option value="">—</option><option value="male">ذكر</option><option value="female">أنثى</option></select></div>
            <div><label class="block text-sm font-medium mb-1">تاريخ الميلاد</label><input type="date" name="birth_date" value="{{ student.birth_date if mode == 'edit' else '' }}" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 outline-none focus:ring-2 focus:ring-primary-500"></div>
            <div><label class="block text-sm font-medium mb-1">ولي الأمر</label><input name="guardian_name" value="{{ student.guardian_name if mode == 'edit' else '' }}" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 outline-none focus:ring-2 focus:ring-primary-500"></div>
            <div><label class="block text-sm font-medium mb-1">هاتف ولي الأمر</label><input name="guardian_phone" value="{{ student.guardian_phone if mode == 'edit' else '' }}" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 outline-none focus:ring-2 focus:ring-primary-500"></div>
            {% if mode == 'create' %}
            <div class="col-span-2"><label class="block text-sm font-medium mb-1">الشعبة</label>
                <select name="section_id" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 outline-none">
                    <option value="">—</option>
                    {% for s in sections %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
                </select>
            </div>
            {% endif %}
        </div>
        <button type="submit" class="bg-primary-600 hover:bg-primary-700 text-white px-6 py-2.5 rounded-lg font-semibold">حفظ</button>
    </form>
</div>
{% endblock %}
