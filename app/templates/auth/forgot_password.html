{% extends "base/auth_base.html" %}
{% block auth_content %}
<div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl p-8">
    <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-slate-800 dark:text-white">استعادة كلمة المرور</h1>
        <p class="text-slate-400 mt-2">أدخل بريدك لاستلام تعليمات الاستعادة</p>
    </div>
    <form class="space-y-4">
        <input type="email" name="email" required class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white focus:ring-2 focus:ring-primary-500 outline-none" placeholder="البريد الإلكتروني">
        <button type="submit" class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-2.5 rounded-lg">إرسال</button>
    </form>
    <div class="mt-6 text-center text-sm"><a href="/login" class="text-primary-600">العودة لتسجيل الدخول</a></div>
</div>
{% endblock %}
