{% extends "base/auth_base.html" %}
{% block auth_content %}
<div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl p-8">
    <div class="text-center mb-8">
        <div class="text-4xl mb-3">🏫</div>
        <h1 class="text-2xl font-bold text-slate-800 dark:text-white">تسجيل الدخول</h1>
        <p class="text-slate-400 mt-2">أدخل بياناتك للوصول إلى النظام</p>
    </div>
    <form method="POST" action="/login" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">البريد الإلكتروني</label>
            <input type="email" name="email" required class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition" placeholder="admin@school.edu">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">كلمة المرور</label>
            <input type="password" name="password" required class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-2.5 rounded-lg transition-colors">دخول</button>
    </form>
    <div class="mt-6 text-center text-sm">
        <a href="/register" class="text-primary-600 hover:text-primary-700 font-medium">تسجيل مدرسة جديدة</a>
    </div>
</div>
{% endblock %}
