{% extends "base/auth_base.html" %}
{% block auth_content %}
<div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl p-8 max-w-lg w-full">
    <div class="text-center mb-6">
        <div class="text-4xl mb-3">🏫</div>
        <h1 class="text-2xl font-bold text-slate-800 dark:text-white">تسجيل مدرسة جديدة</h1>
        <p class="text-slate-400 mt-2">أنشئ حساب المدير وابدأ بإدارة مدرستك</p>
    </div>
    <form method="POST" action="/register" class="space-y-4">
        <div class="border-b border-slate-200 dark:border-slate-600 pb-4 mb-4">
            <h3 class="text-sm font-semibold text-slate-500 mb-3">بيانات المدرسة</h3>
            <div class="grid grid-cols-2 gap-3">
                <div class="col-span-2">
                    <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">اسم المدرسة</label>
                    <input type="text" name="school_name" required class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">رمز المدرسة</label>
                    <input type="text" name="school_code" required class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
            </div>
        </div>
        <div>
            <h3 class="text-sm font-semibold text-slate-500 mb-3">بيانات المدير</h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">الاسم الكامل</label>
                    <input type="text" name="director_name" required class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">البريد الإلكتروني</label>
                    <input type="email" name="director_email" required class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">كلمة المرور (8 أحرف على الأقل)</label>
                    <input type="password" name="director_password" required minlength="8" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
            </div>
        </div>
        <button type="submit" class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-2.5 rounded-lg transition-colors">إنشاء المدرسة</button>
    </form>
    <div class="mt-4 text-center text-sm">
        <a href="/login" class="text-primary-600 hover:text-primary-700 font-medium">لديك حساب؟ تسجيل الدخول</a>
    </div>
</div>
{% endblock %}
