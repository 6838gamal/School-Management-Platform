<script>
    document.addEventListener('DOMContentLoaded', function() {
        const tabs = document.querySelectorAll('.tab-btn');
        const contents = document.querySelectorAll('.tab-content');

        // Set initial active tab
        tabs[0].classList.add('text-primary-600', 'border-primary-500');
        tabs[0].classList.remove('text-slate-500', 'border-transparent');

        tabs.forEach(tab => {
            tab.addEventListener('click', function() {
                // Remove active styles from all tabs
                tabs.forEach(t => {
                    t.classList.remove('text-primary-600', 'border-primary-500');
                    t.classList.add('text-slate-500', 'border-transparent');
                });

                // Add active styles to clicked tab
                this.classList.add('text-primary-600', 'border-primary-500');
                this.classList.remove('text-slate-500', 'border-transparent');

                // Hide all content
                contents.forEach(c => c.classList.add('hidden'));

                // Show selected content
                const target = this.dataset.tab;
                document.getElementById(`form-${target}`).classList.remove('hidden');
            });
        });
    });
</script>
