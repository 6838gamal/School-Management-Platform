{% extends "base/auth_base.html" %}
{% block auth_content %}
<div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl p-8">
    <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-slate-800 dark:text-white">كلمة مرور جديدة</h1>
    </div>
    <form class="space-y-4">
        <input type="password" name="password" required minlength="8" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white focus:ring-2 focus:ring-primary-500 outline-none" placeholder="كلمة المرور الجديدة">
        <input type="password" name="confirm" required class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white focus:ring-2 focus:ring-primary-500 outline-none" placeholder="تأكيد كلمة المرور">
        <button type="submit" class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-2.5 rounded-lg">تعيين</button>
    </form>
</div>
{% endblock %}
