{% extends "layouts/teacher.html" %}
{% block content %}
<div class="space-y-6">
    <h1 class="text-2xl font-bold text-slate-800 dark:text-white">لوحة تحكم المعلم</h1>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-100 dark:border-slate-700">
            <p class="text-slate-400 text-sm">حصص اليوم</p><p class="text-3xl font-bold text-primary-600">{{ stats.today_lessons }}</p>
        </div>
        <div class="bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-100 dark:border-slate-700">
            <p class="text-slate-400 text-sm">إجمالي الحصص</p><p class="text-3xl font-bold text-slate-800 dark:text-white">{{ stats.total_lessons }}</p>
        </div>
        <div class="bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-100 dark:border-slate-700">
            <p class="text-slate-400 text-sm">إشعارات غير مقروءة</p><p class="text-3xl font-bold text-warning-600">{{ stats.unread_notifications }}</p>
        </div>
    </div>
</div>
{% endblock %}
