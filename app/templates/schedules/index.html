{% extends "layouts/director.html" %}
{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <div><h1 class="text-2xl font-bold text-slate-800 dark:text-white">الجداول الدراسية</h1><p class="text-slate-400 text-sm mt-1">إدارة الجداول الأسبوعية</p></div>
        {% if can('schedules.create') %}
        <button onclick="showModal('schedule-select-modal')" class="bg-primary-600 hover:bg-primary-700 text-white px-4 py-2 rounded-lg text-sm font-semibold">+ اختيار شعبة</button>
        {% endif %}
    </div>

    <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700 p-6">
        <div id="schedule-grid" data-sections='{{ sections | tojson }}' data-periods='{{ periods | tojson }}'>
            <div class="empty-state">
                <p>اختر شعبة لعرض أو تعديل الجدول الأسبوعي.</p>
            </div>
        </div>
    </div>
</div>

<div class="modal-backdrop" id="schedule-select-modal">
    <div class="modal-box p-6">
        <h3 class="font-semibold text-lg mb-4">اختر شعبة</h3>
        <select id="schedule-section-select" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 mb-4">
            {% for s in sections %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
        </select>
        <div class="flex gap-2">
            <button onclick="closeModal('schedule-select-modal')" class="flex-1 bg-slate-100 dark:bg-slate-700 px-4 py-2 rounded-lg text-sm font-medium">إلغاء</button>
            <button onclick="loadSchedule()" class="flex-1 bg-primary-600 hover:bg-primary-700 text-white px-4 py-2 rounded-lg text-sm font-semibold">عرض الجدول</button>
        </div>
    </div>
</div>

<script src="/static/js/schedule.js"></script>
<script>
function loadSchedule() {
    const select = document.getElementById('schedule-section-select');
    const sectionId = select.value;
    closeModal('schedule-select-modal');
    const grid = document.getElementById('schedule-grid');
    grid.innerHTML = '<div class="flex justify-center py-8"><div class="spinner"></div></div>';
    apiFetch('/api/v1/schedules', { method: 'POST', body: { section_id: sectionId } })
        .then(data => {
            const scheduleId = data.id || data.schedule_id || '';
            if (!scheduleId) { grid.innerHTML = '<p class="text-slate-400 text-center py-8">تعذر تحميل الجدول</p>'; return; }
            return apiFetch('/api/v1/schedules/' + scheduleId + '/grid').then(gridData => {
                renderScheduleGrid(gridData, scheduleId, sectionId);
            });
        })
        .catch(() => { grid.innerHTML = '<p class="text-slate-400 text-center py-8">حدث خطأ</p>'; });
}

function renderScheduleGrid(data, scheduleId, sectionId) {
    const grid = document.getElementById('schedule-grid');
    const periods = data.periods || [];
    const gridData = data.grid || {};
    const days = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];
    let html = '<div class="schedule-grid" style="grid-template-columns: 80px repeat(' + days.length + ', 1fr);">';
    html += '<div></div>';
    days.forEach(function(d) { html += '<div class="text-center text-xs font-semibold text-slate-500 py-2">' + d + '</div>'; });
    periods.forEach(function(p) {
        html += '<div class="text-xs text-slate-400 py-2 px-1">' + p.name + '</div>';
        for (let day = 0; day < days.length; day++) {
            const entry = (gridData[day] || {})[p.id];
            if (entry) {
                html += '<div class="schedule-cell has-entry bg-primary-50 dark:bg-primary-900/20" data-day="' + day + '" data-period="' + p.id + '" data-entry-id="' + entry.id + '">' + (entry.subject_id ? entry.subject_id.slice(0,8) : '') + '</div>';
            } else {
                html += '<div class="schedule-cell bg-slate-50 dark:bg-slate-700/30" data-day="' + day + '" data-period="' + p.id + '" data-schedule-id="' + scheduleId + '" data-section-id="' + sectionId + '">+</div>';
            }
        }
    });
    html += '</div>';
    grid.innerHTML = html;
}
</script>
{% endblock %}
