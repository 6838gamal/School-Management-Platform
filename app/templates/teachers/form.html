{% extends "layouts/director.html" %}
{% block content %}
<div class="space-y-6 max-w-2xl">
    <h1 class="text-2xl font-bold text-slate-800 dark:text-white">{{ title }}</h1>
    <form class="bg-white dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700 p-6 space-y-4" id="teacher-form">
        <div class="grid grid-cols-2 gap-4">
            <div><label class="block text-sm font-medium mb-1">رقم الموظف</label><input name="employee_number" required class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 outline-none focus:ring-2 focus:ring-primary-500"></div>
            <div><label class="block text-sm font-medium mb-1">الرقم الوطني</label><input name="national_id" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 outline-none focus:ring-2 focus:ring-primary-500"></div>
            <div><label class="block text-sm font-medium mb-1">الاسم الأول</label><input name="first_name" required class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 outline-none focus:ring-2 focus:ring-primary-500"></div>
            <div><label class="block text-sm font-medium mb-1">الاسم الأخير</label><input name="last_name" required class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 outline-none focus:ring-2 focus:ring-primary-500"></div>
            <div><label class="block text-sm font-medium mb-1">التخصص</label><input name="specialization" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 outline-none focus:ring-2 focus:ring-primary-500"></div>
            <div><label class="block text-sm font-medium mb-1">الهاتف</label><input name="phone" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 outline-none focus:ring-2 focus:ring-primary-500"></div>
            <div class="col-span-2"><label class="flex items-center gap-2 text-sm font-medium"><input type="checkbox" name="create_user" class="rounded"> إنشاء حساب دخ للمعلم</label></div>
        </div>
        <button type="submit" class="bg-primary-600 hover:bg-primary-700 text-white px-6 py-2.5 rounded-lg font-semibold">حفظ</button>
    </form>
</div>
<script src="/static/js/teachers.js"></script>
{% endblock %}
