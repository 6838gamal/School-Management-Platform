{% extends "layouts/director.html" %}
{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <div><h1 class="text-2xl font-bold text-slate-800 dark:text-white">تسجيل الحضور</h1><p class="text-slate-400 text-sm mt-1">تاريخ: {{ date }}</p></div>
    </div>

    <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700 p-6">
        <div id="attendance-grid" data-section-id="{{ section_id }}" data-date="{{ date }}">
            <div class="space-y-3">
                {% for r in records %}
                <div data-student-id="{{ r.student_id }}" class="flex items-center justify-between p-3 bg-slate-50 dark:bg-slate-700/30 rounded-lg">
                    <span class="text-sm font-medium">{{ r.student_id[:8] }}</span>
                    <div class="flex gap-2">
                        <button class="attendance-btn {% if r.status == 'present' %}present{% endif %}" data-status="present">حاضر</button>
                        <button class="attendance-btn {% if r.status == 'absent' %}absent{% endif %}" data-status="absent">غائب</button>
                        <button class="attendance-btn {% if r.status == 'late' %}late{% endif %}" data-status="late">متأخر</button>
                        <button class="attendance-btn {% if r.status == 'excused' %}excused{% endif %}" data-status="excused">بعذر</button>
                    </div>
                </div>
                {% else %}
                <div class="empty-state"><p>لا يوجد سجل حضور لهذا اليوم بعد.</p></div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
<script src="/static/js/attendance.js"></script>
{% endblock %}
