# ============================================================
# School Management System - Docker Compose
# ============================================================
# Starts: PostgreSQL, the FastAPI app, and Nginx reverse proxy.

services:
  db:
    image: postgres:16-alpine
    container_name: sms_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_DB:-sms_db}
      POSTGRES_USER: ${DATABASE_USER:-sms_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-sms_password}
    ports:
      - "5432:5432"
    volumes:
      - sms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-sms_user} -d ${DATABASE_DB:-sms_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: sms_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DATABASE_USER:-sms_user}:${DATABASE_PASSWORD:-sms_password}@db:5432/${DATABASE_DB:-sms_db}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - sms_uploads:/app/uploads
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"

  nginx:
    image: nginx:1.27-alpine
    container_name: sms_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  sms_pgdata:
  sms_uploads:
